<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   CODED theme — navy + CODED blue, IBM Plex (matches coded-reels-playbook.vercel.app)
   Single source of truth for colour, type and surfaces on every page.
   Token NAMES are kept from the earlier SPECIMEN build so every component follows
   automatically; only the values changed:
     --crimson = primary accent (CODED blue bright)   --rose / --rose-lt = soft blues
     --maroon / --mid = deep CODED blues               --base / --surf / --card = navy
   Font import (in <head> of every page):
   IBM Plex Sans 400–700 + IBM Plex Mono 500–600 (+ IBM Plex Sans Arabic)
============================================================================ */
:root{
  /* ---- navy canvas & surfaces ---- */
  --base:#00081c;        /* page background behind the navy glow */
  --navy:#14243F;
  --navy-deep:#00112F;
  --surf:#12294f;        /* raised surface (panel) */
  --surf2:#1b3055;       /* secondary surface (card gradients end here) */
  --card:#112340;        /* card background on pages */
  --card-2:#16294a;      /* card alt */
  --raise:#1c3057;       /* hover / lifted */
  --panel:#0b1a33;
  --deep:#00112F;

  /* ---- CODED blue ramp (keeps the old ramp names) ---- */
  --maroon:#003a82;      /* deepest blue — gradient ends */
  --mid:#004AA3;         /* CODED blue */
  --crimson:#2f74d6;     /* PRIMARY accent — bright CODED blue */
  --rose:#6f9ce8;        /* soft blue */
  --rose-lt:#9db3ff;     /* lightest — eyebrows, highlights, small accents */
  --blue:#004AA3;
  --indigo:#3e50dd;
  --red:#f84b4b;         /* CODED red — used sparingly for warnings */
  --red-deep:#c23030;

  /* ---- ink ---- */
  --ink:#ffffff;
  --ink-dim:#9fb2d4;     /* muted */
  --ink-faint:#6f83a8;   /* muted-2 */

  /* ---- white-alpha scale ---- */
  --w:#fff;
  --w8:rgba(255,255,255,.84); --w7:rgba(255,255,255,.72); --w6:rgba(255,255,255,.6);
  --w5:rgba(255,255,255,.48); --w4:rgba(255,255,255,.36); --w3:rgba(255,255,255,.3);
  --w2:rgba(255,255,255,.18); --w1:rgba(255,255,255,.10); --w06:rgba(255,255,255,.05);

  /* ---- hairlines ---- */
  --line:rgba(255,255,255,.12);
  --line-2:rgba(255,255,255,.16);

  /* ---- status ---- */
  --green:#37a06a; --green-lt:#5ad0a0; --green-bg:rgba(90,208,160,.12); --green-bd:rgba(90,208,160,.42);
  --amber:#f0a544;
  --danger:#ff6b6b; --danger-bg:rgba(255,107,107,.10); --danger-bd:rgba(255,107,107,.36);

  /* ---- accent trio for three-of-a-kind cards ---- */
  --ac-rose:#9db3ff; --ac-cyan:#79e2ec; --ac-amber:#ffd196;

  /* ---- type ---- */
  --f:'IBM Plex Sans','IBM Plex Sans Arabic','Helvetica Neue',Arial,sans-serif;
  --mf:'IBM Plex Sans','IBM Plex Sans Arabic','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ============================ BASE ============================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* Page background = navy radial glow + faint grid (CODED hub) */
body{
  background:radial-gradient(125% 125% at 82% 6%,#1c3057 0,#14243F 45%,#00112F 100%) fixed,var(--base);
  color:var(--ink);
  font-family:var(--f);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(85% 85% at 55% 30%,#000 25%,transparent 100%);mask-image:radial-gradient(85% 85% at 55% 30%,#000 25%,transparent 100%)}
a{color:inherit;text-decoration:none}

/* ============================ SHARED MOTION ============================ */
@keyframes shimmer{to{background-position:-220% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(47,116,214,.2),0 0 14px var(--crimson)}50%{box-shadow:0 0 0 6px rgba(47,116,214,0),0 0 20px var(--crimson)}}

/* ===== shared additions on top of theme.css (every page) ===== */
html{scroll-behavior:smooth}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:4px}
b,strong{color:var(--ink)}
/* links whose address is not set yet in site-config.js */
a.pending{opacity:.55;cursor:not-allowed;filter:saturate(.4)}
a.pending:hover{transform:none!important}
/* QR code holder (filled by common.js) */
.qr-soon{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);line-height:1.5}
/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:999;opacity:0;pointer-events:none;
  background:var(--surf2);border:1px solid var(--green-bd);color:var(--green-lt);font-weight:700;font-size:13.5px;
  padding:11px 18px;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== LAB — CODED SPECIMEN lab styles ===== */

  body{display:flex;min-height:100vh}
  a:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:4px}

  /* left rail */
  #rail{width:290px;flex:none;border-right:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  .rail-brand{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  
  .day-chip{margin:16px 22px 0;display:inline-flex;align-self:flex-start;font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--rose-lt);background:rgba(47,116,214,.1);
    border:1px solid rgba(47,116,214,.3);border-radius:999px;padding:6px 12px}
  .prog-wrap{margin:16px 22px 6px}
  .prog-bar{height:6px;border-radius:3px;background:var(--w06);overflow:hidden}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--crimson));transition:width .3s}
  .prog-label{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:7px}
  #navList{flex:1;overflow-y:auto;padding:12px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:3px}
  .nav-item:hover{background:var(--w06)}.nav-item.active{background:rgba(47,116,214,.12);border:1px solid rgba(47,116,214,.25)}
  .nav-item .ni-n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--w06);border:1px solid var(--w1);
    font-family:var(--mono);font-size:11px;font-weight:700;color:var(--rose-lt);display:flex;align-items:center;justify-content:center}
  .nav-item.done .ni-n{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-lt)}
  .nav-item .ni-t{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
  .rail-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
  .rail-foot button{flex:1;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:9px;border-radius:8px;border:1px solid var(--w1);background:var(--w06);color:var(--ink-dim);cursor:pointer}
  .rail-foot button:hover{color:var(--ink)}
  @media(max-width:820px){#rail{position:fixed;left:-300px;z-index:50;transition:left .2s}#rail.open{left:0}}

  /* main */
  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  #mtop{position:sticky;top:0;z-index:20;background:rgba(0,8,28,.9);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px}
  #mtop .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);
    background:var(--w06);border:1px solid var(--w1);border-radius:8px;padding:7px 11px}
  #mtop .back:hover{color:var(--ink)}
  #mtop .ham{display:none}
  @media(max-width:820px){#mtop .ham{display:inline-flex;background:var(--w06);border:1px solid var(--w1);border-radius:8px;padding:8px;cursor:pointer;color:var(--ink)}}
  #mtop .crumb{font-family:var(--mono);font-size:12px;color:var(--ink-faint);flex:1}
  #mtop .mnav{display:flex;gap:8px}
  #mtop .mnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--w1);background:var(--w06);color:var(--ink-dim);cursor:pointer}
  #mtop .mnav button:hover{color:var(--ink)}

  #view{max-width:820px;margin:0 auto;padding:38px 28px 90px;width:100%}
  .task-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--rose-lt);margin-bottom:14px}
  .task-tag .app{background:rgba(47,116,214,.14);border:1px solid rgba(47,116,214,.3);border-radius:6px;padding:3px 8px}
  h1.task-h{font-size:26px;font-weight:800;letter-spacing:-.3px;margin-bottom:12px}
  .scn{font-size:15px;line-height:1.65;color:var(--ink-dim);margin-bottom:24px}

  .step-card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--w1);border-radius:14px;padding:22px 24px;margin-bottom:18px}
  .step-card .sc-k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-lt);margin-bottom:12px}
  .step-card ol{margin:0;padding-left:20px}
  .step-card li{font-size:14.5px;color:var(--ink);line-height:1.55;margin-bottom:8px}
  .prompt{font-family:var(--mono);font-size:13.5px;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--w1);
    border-radius:9px;padding:14px 16px;line-height:1.55;margin:14px 0;position:relative;cursor:pointer;transition:border-color .15s}
  .prompt:hover{border-color:rgba(47,116,214,.4)}
  .prompt .copy-tag{position:absolute;top:8px;right:10px;font-size:10px;color:var(--ink-faint)}
  .prompt.copied{border-color:var(--green-bd)}.prompt.copied .copy-tag{color:var(--green-lt)}

  .expect{background:rgba(240,165,68,.06);border:1px solid rgba(240,165,68,.28);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .expect .ex-k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
  .expect p{font-size:14px;color:var(--ink);line-height:1.55}

  .capture{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .capture label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .capture textarea{width:100%;min-height:90px;background:var(--base);border:1px solid var(--w1);border-radius:9px;
    padding:12px 14px;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;resize:vertical}
  .capture textarea:focus{outline:none;border-color:rgba(47,116,214,.5)}
  .capture .cap-row{display:flex;align-items:center;gap:12px;margin-top:12px}
  .cap-btn{padding:10px 18px;border-radius:9px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--crimson),var(--maroon));box-shadow:0 6px 20px rgba(47,116,214,.3)}
  .cap-btn:hover{transform:translateY(-1px)}
  .cap-done{font-family:var(--mono);font-size:12px;color:var(--green-lt);display:none;align-items:center;gap:7px}
  .cap-done.on{display:inline-flex}

  .task-foot{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
  .tf-btn{padding:12px 20px;border-radius:10px;border:1px solid var(--w1);background:var(--w06);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
  .tf-btn.next{background:linear-gradient(135deg,var(--crimson),var(--maroon));border:none;color:#fff}
  .tf-btn:disabled{opacity:.4;cursor:not-allowed}

  /* E1.2 · CTFT build-and-test widget */
  .lw-tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .lw-tab{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;
    border:1px solid var(--w1);background:var(--w06);color:var(--ink-dim);transition:.15s}
  .lw-tab.on{border-color:rgba(47,116,214,.5);color:var(--ink);background:rgba(47,116,214,.13)}
  .lw-job{font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:14px}
  .lw-job b{color:var(--rose-lt)}
  .lw-doc{background:rgba(0,0,0,.3);border:1px solid var(--w1);border-radius:10px;padding:12px 15px;max-height:280px;overflow:auto;margin-bottom:16px}
  .lw-pre{font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink-dim);white-space:pre-wrap;margin:0}
  .lw-fields{display:flex;flex-direction:column;gap:9px}
  .lw-fields input{width:100%;box-sizing:border-box;background:var(--base);border:1px solid var(--w1);border-radius:9px;
    padding:11px 14px;color:var(--ink);font-family:var(--f);font-size:13.5px}
  .lw-fields input:focus{outline:none;border-color:rgba(47,116,214,.5)}
  .lw-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .lw-btn{padding:9px 16px;border-radius:9px;border:none;font-weight:700;font-size:13px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--crimson),var(--maroon))}
  .lw-btn.ghost{background:var(--w06);border:1px solid var(--w1);color:var(--ink-dim)}
  .lw-btn:hover{transform:translateY(-1px)}
  .lw-hint{font-family:var(--mono);font-size:11px;color:var(--green-lt)}
  .lw-out{width:100%;box-sizing:border-box;min-height:78px;margin-top:10px;background:rgba(0,0,0,.28);border:1px solid var(--w1);
    border-radius:9px;padding:12px 14px;color:var(--ink);font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical}
  .lw-out:focus{outline:none;border-color:rgba(47,116,214,.5)}
  .lw-test{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:13px;font-weight:700;color:var(--ink);
    background:var(--w06);border:1px solid var(--w1);border-radius:9px;padding:9px 15px}
  .lw-starters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lw-starters .prompt{margin:0}
  @media(max-width:640px){.lw-starters{grid-template-columns:1fr}}
  /* E1.3 builder + E1.5 copyable briefs */
  .bprev{background:rgba(0,0,0,.3);border:1px solid var(--w1);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:13px;line-height:1.7;min-height:110px;color:var(--ink);margin-top:6px}
  .bprev em{font-style:normal;color:var(--ink-faint)}
  .blegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .blegend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-faint)}
  .blegend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .sg-role{color:var(--amber)} .sg-ctx{color:var(--rose-lt)} .sg-task{color:#fff;font-weight:700} .sg-fmt{color:var(--ac-cyan)} .sg-tone{color:var(--green-lt)}
  .lw-briefs{margin-bottom:12px}
  .lw-briefs .lw-pre{background:rgba(0,0,0,.3);border:1px solid var(--w1);border-radius:10px;padding:14px 16px;max-height:280px;overflow:auto;cursor:pointer;transition:border-color .15s;position:relative}
  .lw-briefs .lw-pre:hover{border-color:rgba(47,116,214,.4)}
  .lw-briefs .lw-pre.copied{border-color:var(--green-bd)}


  /* attached dataset */
  .dataset{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;margin-bottom:18px}
  .dataset .ds-k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-lt);margin-bottom:6px}
  .dataset .ds-note{font-size:13.5px;color:var(--ink-dim);line-height:1.55;margin-bottom:12px}
  .dl{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;border:1px solid rgba(90,208,160,.3);
    background:rgba(90,208,160,.08);color:var(--ink);font-weight:700;font-size:13.5px}
  .dl:hover{border-color:rgba(90,208,160,.6)}
  .dl .ic{width:26px;height:26px;border-radius:7px;background:rgba(90,208,160,.16);display:flex;align-items:center;justify-content:center;font-size:13px}
  .dl small{display:block;font-weight:600;font-size:11px;color:var(--ink-faint);margin-top:1px}
  .ds-table-wrap{margin-top:14px;overflow-x:auto;border:1px solid var(--w1);border-radius:10px}
  table.ds-table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px}
  table.ds-table th{background:var(--surf2);color:var(--ink);text-align:left;padding:8px 10px;border-bottom:1px solid var(--w1);white-space:nowrap;font-weight:700}
  table.ds-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--ink-dim);white-space:nowrap}
  table.ds-table tr:last-child td{border-bottom:none}
  .ds-more{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding:8px 10px}
  /* meeting-recap data block */
  .recap-card{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;margin-bottom:18px}
  .recap-pre{margin-top:10px;background:var(--surf);border:1px solid var(--w1);border-radius:10px;padding:14px 16px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink);line-height:1.6;white-space:pre-wrap;overflow-x:auto}
  /* launch button for interactive sub-exercise */
  .launch-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;padding:18px 22px;
    border-radius:14px;border:none;text-decoration:none;background:linear-gradient(135deg,var(--crimson),var(--maroon));color:#fff;box-shadow:0 8px 26px rgba(47,116,214,.28)}
  .launch-btn:hover{transform:translateY(-1px)}
  .launch-btn b{font-size:15.5px;display:block}
  .launch-btn span.sub{font-size:13px;color:rgba(255,255,255,.82);display:block;margin-top:3px}
  .launch-btn .ar{font-size:22px;flex:none}
  /* attached files (downloads) */
  .files{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
  .files .fnote{width:100%;font-size:13px;color:var(--ink-dim);line-height:1.5;margin-bottom:2px}
  /* multi-step prompts */
  .pstep{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--w1);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .pstep-h{display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:12px}
  .pstep-n{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(47,116,214,.14);border:1px solid rgba(47,116,214,.35);
    color:var(--rose-lt);font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  /* findings inputs */
  .findings{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:620px){.findings{grid-template-columns:1fr}}
  .find{display:flex;flex-direction:column;gap:5px}
  .find span{font-size:12px;font-weight:700;color:var(--ink-dim)}
  .find-in{background:var(--base);border:1px solid var(--w1);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:var(--f);font-size:13.5px}
  .find-in:focus{outline:none;border-color:rgba(47,116,214,.5)}

<script>
/* ===== CODED Copilot workshop — shared runtime (inlined into every page) =====
   config text + links + QR · clipboard · toast · role · Prompt Bank · profile */
(function(){
  var S = window.SITE || {};
  function get(path){ return String(path).split('.').reduce(function(o,k){ return o == null ? o : o[k]; }, S); }
  window.cfgGet = get;

  function applyConfig(root){
    root = root || document;
    root.querySelectorAll('[data-cfg]').forEach(function(el){
      var v = get(el.getAttribute('data-cfg')); if (v) el.textContent = v;
    });
    root.querySelectorAll('[data-link]').forEach(function(el){
      var v = get('links.' + el.getAttribute('data-link'));
      var lab = el.querySelector('[data-pending]');
      if (v) {
        el.setAttribute('href', v); el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener');
        el.classList.remove('pending'); el.removeAttribute('aria-disabled');
      } else {
        el.classList.add('pending'); el.removeAttribute('href');
        el.setAttribute('aria-disabled', 'true'); el.setAttribute('title', 'Link coming soon');
        if (lab) lab.textContent = lab.getAttribute('data-pending');
      }
    });
    root.querySelectorAll('[data-linktext]').forEach(function(el){
      var v = get('links.' + el.getAttribute('data-linktext'));
      el.textContent = v ? v.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '') : 'Link coming soon';
    });
    root.querySelectorAll('[data-qr]').forEach(function(el){
      var v = get('links.' + el.getAttribute('data-qr'));
      if (v && window.qrcode) {
        try { var q = qrcode(0, 'M'); q.addData(v); q.make();
          el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
          el.classList.add('ready'); el.setAttribute('data-url', v);
        } catch (e) { el.innerHTML = '<span class="qr-soon">QR code<br>unavailable</span>'; }
      } else {
        el.classList.remove('ready');
        el.innerHTML = '<span class="qr-soon">QR code<br>coming soon</span>';
      }
    });
  }
  window.applyConfig = applyConfig;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ applyConfig(); });
  else applyConfig();

  /* ---- safe storage ---- */
  var store = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  window.store = store;

  /* ---- clipboard with fallback ---- */
  window.copyText = function(text){
    text = String(text || '');
    function fallback(){
      return new Promise(function(res, rej){
        try { var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
          ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
          var ok = document.execCommand('copy'); document.body.removeChild(ta); ok ? res() : rej(); }
        catch (e) { rej(e); }
      });
    }
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(fallback);
    return fallback();
  };

  /* ---- toast ---- */
  window.toast = function(msg){
    var t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 2200);
  };

  /* ---- role (the participant's track, remembered across all three days) ---- */
  var ROLES = { executive: 'Executive', sales: 'Sales', marketing: 'Marketing', technical: 'Technical' };
  window.ROLES = ROLES;
  window.ROLE = {
    get: function(){ var r = store.get('coded_copilot_role', ''); return ROLES[r] ? r : ''; },
    set: function(r){ if (ROLES[r]) store.set('coded_copilot_role', r); }
  };

  /* ---- Prompt Bank (one list, shared by every lab and the Prompt Bank page) ---- */
  var PBK = 'coded_copilot_prompt_bank';
  window.PB = {
    all: function(){ var a = store.get(PBK, []); return Array.isArray(a) ? a : []; },
    save: function(a){ return store.set(PBK, a); },
    add: function(text, meta){
      text = String(text || '').trim(); meta = meta || {};
      if (!text) return 'empty';
      var a = this.all();
      if (a.some(function(x){ return x.text === text; })) return 'dup';
      a.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text,
        title: meta.title || '', app: meta.app || '', day: meta.day || '', role: meta.role || (window.ROLE ? ROLE.get() : ''),
        ts: new Date().toISOString() });
      return this.save(a) ? 'ok' : 'fail';
    },
    remove: function(id){ this.save(this.all().filter(function(x){ return x.id !== id; })); },
    update: function(id, patch){ this.save(this.all().map(function(x){ return x.id === id ? Object.assign({}, x, patch) : x; })); }
  };
  window.pbAdd = function(text, meta){
    var r = PB.add(text, meta);
    toast(r === 'ok' ? 'Saved to your Prompt Bank ✓' : r === 'dup' ? 'Already in your Prompt Bank' :
          r === 'empty' ? 'Nothing to save yet' : 'Could not save — your browser blocked storage');
    return r;
  };

  /* ---- profile (Day 1 time audit → Day 3 capstone) ---- */
  window.PROFILE = {
    get: function(){ return store.get('coded_copilot_profile', { tasks: [] }); },
    set: function(p){ return store.set('coded_copilot_profile', p); }
  };
})();

(function(){
  var L = window.LAB, T = L.tasks, KEY = L.key;
  var state = store.get(KEY, {}); if (typeof state !== 'object' || !state) state = {};
  var cur = 0;
  var $ = function(id){ return document.getElementById(id); };
  function save(){ store.set(KEY, state); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function attr(s){ return esc(s).replace(/"/g, '&quot;'); }
  function st(i){ return state[T[i].id] || (state[T[i].id] = {}); }

  /* ---- role handling ---- */
  function role(){ return ROLE.get(); }
  function variantOf(t){
    if (!t.roles) return t;
    var r = role(); var keys = Object.keys(t.roles);
    var pick = t.roles[r] ? r : keys[0];
    var v = Object.assign({}, t, t.roles[pick]); v._role = pick; v._roles = keys; return v;
  }
  function drawRoleChip(){
    var sel = $('roleSel'); if (!sel) return;
    sel.value = role() || '';
  }

  /* ---- nav + progress ---- */
  function buildNav(){
    var nl = $('navList'); nl.innerHTML = '';
    T.forEach(function(t, i){
      var d = state[t.id] && state[t.id].done;
      var el = document.createElement('button'); el.type = 'button';
      el.className = 'nav-item' + (i === cur ? ' active' : '') + (d ? ' done' : '') + (t.optional ? ' opt' : '');
      el.innerHTML = '<span class="ni-n">' + (d ? '✓' : esc(t.id.replace(/^E/, ''))) + '</span><span class="ni-t">' + esc(t.title) + (t.optional ? ' <em>stretch</em>' : '') + '</span>';
      el.onclick = function(){ go(i); if (window.innerWidth < 820) $('rail').classList.remove('open'); };
      nl.appendChild(el);
    });
  }
  function updateProg(){
    var core = T.filter(function(t){ return !t.optional; });
    var done = core.filter(function(t){ return state[t.id] && state[t.id].done; }).length;
    $('progFill').style.width = (done / Math.max(1, core.length) * 100) + '%';
    $('progLabel').textContent = done + ' of ' + core.length + ' core tasks done';
  }

  /* ---- blocks ---- */
  function promptBox(text, label, tag){
    return '<div class="prompt-wrap"><div class="prompt" data-copy="' + attr(text) + '"><span class="copy-tag">tap to copy</span>' + (label ? '<span class="p-lab">' + esc(label) + '</span>' : '') + esc(text) + '</div>' +
      '<span class="pb-hint">Worth keeping? Paste it into your Prompt Bank in Word.</span></div>';
  }
  function datasetBlock(d){
    return '<div class="dataset"><div class="ds-k">Attached data</div><div class="ds-note">' + d.note + '</div>' +
      '<a class="dl" href="' + attr(d.href) + '" download><span class="ic">⬇</span><span>Download the workbook<small>' + esc(d.label) + '</small></span></a>' +
      (d.head ? '<div class="ds-table-wrap"><table class="ds-table"><thead><tr>' + d.head.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      d.rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>' +
      (d.more ? '<div class="ds-more">' + esc(d.more) + '</div>' : '') + '</div>' : '') + '</div>';
  }
  function filesBlock(files){
    return '<div class="dataset"><div class="ds-k">Attached file' + (files.length > 1 ? 's' : '') + '</div>' + files.map(function(f){
      return (f.note ? '<div class="ds-note">' + f.note + '</div>' : '') + '<a class="dl" href="' + attr(f.href) + '" download><span class="ic">⬇</span><span>Download<small>' + esc(f.label) + '</small></span></a>';
    }).join('<div style="height:10px"></div>') + '</div>';
  }
  function briefsBlock(briefs){
    var tabs = briefs.length > 1 ? '<div class="lw-tabs">' + briefs.map(function(b, i){ return '<button type="button" class="lw-tab' + (i ? '' : ' on') + '" data-bt="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div>' : '';
    return '<div class="step-card"><div class="sc-k">' + (briefs.length > 1 ? 'Sample material — pick one, tap to copy' : esc(briefs[0].label) + ' — tap to copy') + '</div>' + tabs +
      '<div class="lw-briefs">' + briefs.map(function(b, i){ return '<pre class="lw-pre copyable" data-b="' + i + '"' + (i ? ' hidden' : '') + '>' + esc(b.text) + '</pre>'; }).join('') + '</div>' +
      '<div class="lw-hint2">Tap the box to copy the whole text.</div></div>';
  }
  function findVal(k){ var s = st(cur); return (s.findings && s.findings[k]) || ''; }
  function findingsBlock(findings, prefix){
    return '<div class="findings-k">✎ Record what you found</div><div class="findings">' + findings.map(function(f, i){
      var k = prefix + '_' + i, v = findVal(k);
      return '<label class="find"><span>' + esc(f.label) + '</span><input class="find-in' + (v ? ' filled' : '') + '" data-fk="' + k + '" placeholder="' + attr(f.hint || '') + '" value="' + attr(v) + '"></label>';
    }).join('') + '</div>';
  }
  function goalBlock(g){ return '<div class="goal"><div class="gk">Your goal — write a CTFT prompt for this</div>' + g + '</div>'; }
  function revealPrompt(p, label){
    return '<details class="reveal"><summary>🔓 Stuck? Reveal a suggested prompt</summary>' + promptBox(p, '', label) + '</details>';
  }
  function promptStepsBlock(steps, t){
    return steps.map(function(ps, si){
      return '<div class="pstep"><div class="pstep-h"><span class="pstep-n">' + (si + 1) + '</span>' + esc(ps.label) + '</div>' +
        (ps.goal ? goalBlock(ps.goal) : '') + (ps.prompt ? revealPrompt(ps.prompt, t.id + ' · ' + ps.label) : '') +
        (ps.findings ? findingsBlock(ps.findings, 's' + si) : '') + '</div>';
    }).join('');
  }
  function checkBlock(r){ return '<details class="check"><summary>✔ Check your findings</summary><div class="check-body">' + r + '</div></details>'; }

  /* ---- widgets ---- */
  var W = {};
  W.timeaudit = function(){
    var p = PROFILE.get(); var tasks = (p.tasks || []).slice(0, 3); while (tasks.length < 3) tasks.push({ text: '', tag: '', hours: '' });
    var tags = ['Generate', 'Condense', 'Find', 'Transform'];
    return '<div class="step-card"><div class="sc-k">Your time audit — saved in this browser</div>' +
      '<div class="ta-role"><span>Your track for the three days:</span>' + Object.keys(ROLES).map(function(k){ return '<button type="button" class="ta-r' + (role() === k ? ' on' : '') + '" data-r="' + k + '">' + ROLES[k] + '</button>'; }).join('') + '</div>' +
      tasks.map(function(x, i){
        return '<div class="ta-row"><span class="ta-n">' + (i + 1) + '</span><input class="ta-t" data-i="' + i + '" placeholder="A task that drains your week, e.g. writing the weekly sales update" value="' + attr(x.text) + '">' +
          '<select class="ta-tag" data-i="' + i + '"><option value="">What would AI do?</option>' + tags.map(function(g){ return '<option' + (x.tag === g ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select>' +
          '<input class="ta-h" data-i="' + i + '" type="number" min="0" step="0.5" placeholder="hrs / wk" value="' + attr(x.hours) + '"></div>';
      }).join('') + '<div class="ta-sum" id="taSum"></div></div>';
  };
  W.builder = function(t){
    var F = [['role', 'Role (part of Context) — who should Copilot act as?'], ['ctx', 'Context — the situation, background, audience'], ['task', 'Task — what exactly should it produce?'],
      ['fmt', 'Format — length, structure, layout'], ['tone', 'Tone — the voice, plus any limits'], ['src', 'Source (optional) — which file? Type / in Copilot to add it'], ['ex', 'Example (optional) — a sample to imitate']];
    var s = st(cur).builder || {};
    return '<div class="step-card"><div class="sc-k">Prompt builder</div><div class="lw-fields">' +
      F.map(function(f){ return '<input class="bf" data-k="' + f[0] + '" placeholder="' + attr(f[1]) + '" value="' + attr(s[f[0]] || '') + '">'; }).join('') +
      '<div class="lw-row"><button type="button" class="lw-btn" id="bLoad">Load the example for my track</button><button type="button" class="lw-btn ghost" id="bCopy">Copy</button><span class="lw-hint" id="bHint"></span></div>' +
      '<div class="bprev" id="bPrev"><em>Your assembled prompt appears here as you type…</em></div>' +
      '<div class="blegend"><span><i style="background:var(--amber)"></i>Role</span><span><i style="background:var(--rose-lt)"></i>Context</span><span><i style="background:#fff"></i>Task</span><span><i style="background:var(--ac-cyan)"></i>Format</span><span><i style="background:var(--green-lt)"></i>Tone</span><span><i style="background:var(--blue)"></i>Source</span></div>' +
      '<a class="lw-test" href="https://copilot.cloud.microsoft/" target="_blank" rel="noopener">Test in Copilot Chat ↗</a></div></div>';
  };
  W.zth = function(t){
    var s = st(cur).zth || {};
    return '<div class="step-card"><div class="sc-k">Rate each round — 1 (mush) to 5 (sendable)</div>' +
      t.rounds.map(function(r, i){
        return '<div class="zr"><div class="zr-h"><span class="zr-n">R' + i + '</span><span class="zr-l">' + esc(r.label) + '</span>' +
          '<span class="zr-rate">' + [1, 2, 3, 4, 5].map(function(n){ return '<button type="button" class="zr-b' + (s[i] == n ? ' on' : '') + '" data-z="' + i + '" data-v="' + n + '">' + n + '</button>'; }).join('') + '</span></div>' +
          '<div class="prompt" data-copy="' + attr(r.text) + '"><span class="copy-tag">tap to copy</span>' + esc(r.text) + '</div></div>';
      }).join('') +
      '<div class="zr-all"><div class="sc-k" style="margin:4px 0 10px">The full Round 4 prompt, assembled</div>' + promptBox(t.rounds.slice(1).map(function(r){ return r.text; }).join(' '), '', t.id + ' · Catering apology (Round 4)') + '</div></div>';
  };
  W.hunt = function(t){
    var s = st(cur).hunt || {};
    return '<div class="step-card"><div class="sc-k">Tick each one you can find</div><div class="hunt">' + t.hunt.map(function(h, i){
      return '<label class="hunt-i' + (s[i] ? ' on' : '') + '"><input type="checkbox" data-h="' + i + '"' + (s[i] ? ' checked' : '') + '><span><b>' + esc(h.name) + '</b><small>' + h.where + '</small></span></label>';
    }).join('') + '</div></div>';
  };

  /* ---- render ---- */
  function render(){
    var t = variantOf(T[cur]); var s = st(cur);
    $('crumb').textContent = t.id + ' · ' + t.app;
    var roleTabs = t._roles ? '<div class="role-tabs"><span class="rt-k">Scenario for:</span>' + t._roles.map(function(k){ return '<button type="button" class="role-tab' + (k === t._role ? ' on' : '') + '" data-role="' + k + '">' + ROLES[k] + '</button>'; }).join('') +
      '<span class="rt-note">' + (role() ? 'Showing your track. Tap another to switch.' : 'Pick your track — the lab remembers it.') + '</span></div>' : '';
    var h = '';
    h += '<div class="task-tag"><span class="app">' + esc(t.app) + '</span> ' + esc(t.id) + (t.minutes ? ' · ' + esc(t.minutes) : '') + (t.optional ? ' · stretch' : '') + '</div>';
    h += '<h1 class="task-h">' + esc(t.title) + '</h1>' + roleTabs;
    h += '<p class="scn">' + t.scenario + '</p>';
    if (t.fallback) h += '<details class="fallback"><summary>No Copilot in this app?</summary><div>' + t.fallback + '</div></details>';
    if (t.dataset) h += datasetBlock(t.dataset);
    if (t.files) h += filesBlock(t.files);
    if (t.briefs) h += briefsBlock(t.briefs);
    if (t.launch) h += '<a class="launch-btn" href="' + attr(t.launch.href) + '"' + (t.launch.ext ? ' target="_blank" rel="noopener"' : '') + '><span><b>' + esc(t.launch.label) + '</b><span class="sub">' + (t.launch.note || '') + '</span></span><span class="ar">→</span></a>';
    if (t.launches) h += t.launches.map(function(l){ return '<a class="launch-btn" ' + (l.link ? 'data-link="' + l.link + '"' : 'href="' + attr(l.href) + '" target="_blank" rel="noopener"') + '><span><b>' + esc(l.label) + '</b><span class="sub"' + (l.link ? ' data-pending="Link coming soon — your trainer will share it in the room."' : '') + '>' + (l.note || '') + '</span></span><span class="ar">→</span></a>'; }).join('');
    if (t.ctftNote || t.writeOwn) h += '<div class="ctft-note"><b>Write the prompt yourself.</b> Use <b>CTFT — Context · Task · Format · Tone</b> for each goal below. Stuck? Tap “Reveal a suggested prompt”.</div>';
    if (t.steps) {
      h += '<div class="step-card"><div class="sc-k">Steps</div><ol>' + t.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>';
      if (t.goal) h += goalBlock(t.goal);
      if (t.prompt) h += (t.hidePrompt ? revealPrompt(t.prompt, t.id + ' · ' + t.title) : promptBox(t.prompt, '', t.id + ' · ' + t.title));
      if (t.prompts && !t.writeOwn) h += t.prompts.map(function(p){ return promptBox(p.text, p.label, t.id + ' · ' + (p.label || t.title)); }).join('');
      if (t.findings && !t.writeOwn) h += findingsBlock(t.findings, 'top');
      h += '</div>';
    }
    /* writeOwn: each prompt becomes a goal to write a CTFT prompt for; the prompt itself hides behind "Stuck?" */
    if (t.prompts && t.writeOwn) h += promptStepsBlock(t.prompts.map(function(p){ return { label: p.label.replace(/^\d+\s*·\s*/, ''), goal: p.goal, prompt: p.text }; }), t) +
      (t.findings ? '<div class="step-card">' + findingsBlock(t.findings, 'top') + '</div>' : '');
    if (t.starters) h += '<div class="step-card"><div class="sc-k">Starter menu — tap any to copy</div><div class="lw-starters">' + t.starters.map(function(x){ return promptBox(x, '', t.id + ' · starter'); }).join('') + '</div></div>';
    if (t.promptSteps) h += promptStepsBlock(t.promptSteps, t);
    if (t.widget && W[t.widget]) h += W[t.widget](t);
    if (t.reveal) h += checkBlock(t.reveal);
    h += '<div class="expect"><div class="ex-k">Done looks like</div><p>' + t.expect + '</p></div>';
    if (t.stretch) h += '<div class="tier tier-2"><div class="sc-k">Tier 2 · Stretch — finished early?</div><p>' + t.stretch + '</p></div>';
    if (t.boss) h += '<div class="tier tier-3"><div class="sc-k">Tier 3 · Boss challenge</div><p>' + t.boss + '</p></div>';
    h += '<div class="capture"><label for="note">Paste your Copilot result — or a note on how it went</label>' +
      '<textarea id="note" placeholder="Optional. Saved in this browser so you can come back to it.">' + esc(s.note || '') + '</textarea>' +
      '<div class="cap-row"><button type="button" class="cap-btn" id="markDone">' + (s.done ? 'Done ✓' : 'Mark done') + '</button><span class="cap-done' + (s.done ? ' on' : '') + '" id="capDone">✓ Saved</span></div></div>';
    h += '<div class="task-foot"><button type="button" class="tf-btn" id="tfPrev"' + (cur === 0 ? ' disabled' : '') + '>‹ Previous</button><button type="button" class="tf-btn next" id="tfNext"' + (cur === T.length - 1 ? ' disabled' : '') + '>Next task ›</button></div>';
    var v = $('view'); v.innerHTML = h; v.scrollTop = 0; window.scrollTo(0, 0);
    if (window.applyConfig) applyConfig(v);
    wire(v, t);
    buildNav(); updateProg();
    if (history.replaceState) history.replaceState(null, '', '#' + T[cur].id);
  }

  function flash(el, cls, tagSel, txt){ el.classList.add(cls); var tg = tagSel ? el.querySelector(tagSel) : null, old = tg ? tg.textContent : '';
    if (tg) tg.textContent = txt; setTimeout(function(){ el.classList.remove(cls); if (tg) tg.textContent = old; }, 1500); }

  function wire(v, t){
    v.querySelectorAll('.prompt[data-copy]').forEach(function(p){ p.onclick = function(){ copyText(p.getAttribute('data-copy')).then(function(){ flash(p, 'copied', '.copy-tag', 'copied ✓'); }).catch(function(){}); }; });
    v.querySelectorAll('.role-tab').forEach(function(b){ b.onclick = function(){ ROLE.set(b.getAttribute('data-role')); drawRoleChip(); render(); }; });
    // brief tabs + copy
    v.querySelectorAll('.lw-tab[data-bt]').forEach(function(tb){ tb.onclick = function(){ var i = tb.getAttribute('data-bt');
      v.querySelectorAll('.lw-tab[data-bt]').forEach(function(x){ x.classList.toggle('on', x === tb); });
      v.querySelectorAll('.lw-briefs [data-b]').forEach(function(el){ el.hidden = el.getAttribute('data-b') !== i; }); }; });
    v.querySelectorAll('.lw-pre.copyable').forEach(function(pre){ pre.onclick = function(){ copyText(pre.textContent).then(function(){ pre.classList.add('copied'); toast('Copied ✓'); setTimeout(function(){ pre.classList.remove('copied'); }, 1200); }).catch(function(){}); }; });
    // findings
    v.querySelectorAll('.find-in').forEach(function(inp){ inp.oninput = function(e){ var s = st(cur); s.findings = s.findings || {}; s.findings[e.target.getAttribute('data-fk')] = e.target.value; save(); e.target.classList.toggle('filled', !!e.target.value); }; });
    // time audit
    if (v.querySelector('.ta-row')) {
      var p = PROFILE.get(); p.tasks = p.tasks || [];
      var sync = function(){ var rows = []; v.querySelectorAll('.ta-row').forEach(function(r, i){ rows.push({ text: r.querySelector('.ta-t').value.trim(), tag: r.querySelector('.ta-tag').value, hours: r.querySelector('.ta-h').value }); });
        p.tasks = rows; p.role = role(); PROFILE.set(p);
        var hrs = rows.reduce(function(a, r){ return a + (parseFloat(r.hours) || 0); }, 0), filled = rows.filter(function(r){ return r.text; }).length;
        $('taSum').innerHTML = filled ? '<b>' + filled + '</b> task' + (filled > 1 ? 's' : '') + ' · about <b>' + hrs + ' hours</b> a week. Biggest one = your capstone candidate on Thursday.' : ''; };
      v.querySelectorAll('.ta-t,.ta-h').forEach(function(x){ x.oninput = sync; }); v.querySelectorAll('.ta-tag').forEach(function(x){ x.onchange = sync; });
      v.querySelectorAll('.ta-r').forEach(function(b){ b.onclick = function(){ ROLE.set(b.getAttribute('data-r')); v.querySelectorAll('.ta-r').forEach(function(x){ x.classList.toggle('on', x === b); }); drawRoleChip(); sync(); }; });
      sync();
    }
    // builder
    if (v.querySelector('.bf')) {
      var bPrev = $('bPrev'), cls = { role: 'sg-role', ctx: 'sg-ctx', task: 'sg-task', fmt: 'sg-fmt', tone: 'sg-tone', src: 'sg-src', ex: 'sg-ctx' };
      var vals = function(){ var o = {}; v.querySelectorAll('.bf').forEach(function(f){ o[f.getAttribute('data-k')] = f.value.trim(); }); return o; };
      var assembled = function(){ var o = vals(); return ['role', 'ctx', 'task', 'fmt', 'tone', 'src', 'ex'].filter(function(k){ return o[k]; }).map(function(k){ return k === 'ex' ? 'Match the structure and voice of this example: ' + o[k] : (k === 'src' ? 'Use ' + o[k] + ' as the source.' : o[k]); }).join(' '); };
      var draw = function(){ var o = vals(); var html = ['role', 'ctx', 'task', 'fmt', 'tone', 'src', 'ex'].filter(function(k){ return o[k]; }).map(function(k){ return '<span class="' + cls[k] + '">' + esc(k === 'ex' ? 'Match the structure and voice of this example: ' + o[k] : (k === 'src' ? 'Use ' + o[k] + ' as the source.' : o[k])) + '</span>'; }).join(' ');
        bPrev.innerHTML = html || '<em>Your assembled prompt appears here as you type…</em>'; var s = st(cur); s.builder = o; save(); };
      v.querySelectorAll('.bf').forEach(function(f){ f.oninput = draw; });
      $('bLoad').onclick = function(){ var ex = (t.examples || {})[role() || 'sales'] || (t.examples || {}).sales; if (!ex) return; v.querySelectorAll('.bf').forEach(function(f){ f.value = ex[f.getAttribute('data-k')] || ''; }); draw(); };
      $('bCopy').onclick = function(){ var a = assembled(); if (!a) return; copyText(a).then(function(){ $('bHint').textContent = 'copied ✓'; setTimeout(function(){ $('bHint').textContent = ''; }, 1500); }); };
      draw();
    }
    // zero to hero ratings
    v.querySelectorAll('.zr-b').forEach(function(b){ b.onclick = function(){ var s = st(cur); s.zth = s.zth || {}; s.zth[b.getAttribute('data-z')] = +b.getAttribute('data-v'); save();
      v.querySelectorAll('.zr-b[data-z="' + b.getAttribute('data-z') + '"]').forEach(function(x){ x.classList.toggle('on', x === b); }); }; });
    // feature hunt
    v.querySelectorAll('.hunt input').forEach(function(c){ c.onchange = function(){ var s = st(cur); s.hunt = s.hunt || {}; s.hunt[c.getAttribute('data-h')] = c.checked; save(); c.closest('.hunt-i').classList.toggle('on', c.checked); }; });
    // capture
    $('markDone').onclick = function(){ var s = st(cur); s.done = true; s.note = $('note').value; save(); $('capDone').classList.add('on'); $('markDone').textContent = 'Done ✓'; buildNav(); updateProg(); toast('Task marked done ✓'); };
    $('note').oninput = function(e){ var s = st(cur); s.note = e.target.value; save(); };
    var p1 = $('tfPrev'), n1 = $('tfNext');
    if (p1) p1.onclick = function(){ go(cur - 1); };
    if (n1) n1.onclick = function(){ go(cur + 1); };
  }

  function go(i){ if (i < 0 || i >= T.length) return; cur = i; render(); }
  window.labGo = go;
  $('mPrev').onclick = function(){ go(cur - 1); };
  $('mNext').onclick = function(){ go(cur + 1); };
  $('ham').onclick = function(){ $('rail').classList.toggle('open'); };
  $('resetBtn').onclick = function(){ if (confirm('Clear your notes and progress for this day? (Your Prompt Bank in Word is not affected.)')) { state = {}; save(); cur = 0; render(); } };
  var rs = $('roleSel'); if (rs) rs.onchange = function(){ if (rs.value) ROLE.set(rs.value); render(); };
  window.addEventListener('hashchange', function(){ var i = T.findIndex(function(t){ return '#' + t.id === location.hash; }); if (i >= 0 && i !== cur) go(i); });
  var start = T.findIndex(function(t){ return '#' + t.id === location.hash; });
  cur = start >= 0 ? start : 0;
  drawRoleChip(); render();
})();

</script>
</body>
</html>
